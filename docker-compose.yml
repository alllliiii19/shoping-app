services:
   postgres:
      image: postgres:18-alpine
      container_name: postgres01
      env_file:
         - .env
      ports:
         - "5432:5432"
      volumes:
         - postgres_data:/var/lib/postgresql
         - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U postgres -d shopping"]
         interval: 5s
         timeout: 5s
         retries: 5
      restart: unless-stopped


   redis:
      image: redis:8-alpine
      container_name: redis01
      ports:
         - "6379:6379"

      restart: unless-stopped

   backend:
      build: ./backend
      container_name: backend01
      ports:
         - "3000:3000"
      environment:
         DB_HOST: postgres
         DB_PORT: 5432
         DB_USER: postgres
         DB_PASSWORD: postgres
         DB_NAME: shopping
         REDIS_HOST: redis
         REDIS_PORT: 6379
         JWT_SECRET: some_long_random_string_change_this_later
         PORT: 3000
      depends_on:
         postgres:
            condition: service_healthy
      restart: unless-stopped  

   frontend:
      build: ./frontend
      container_name: frontend01
      restart: unless-stopped

   nginx:
      image: nginx:alpine
      container_name: nginx01
      ports:
         - "80:80"
      volumes:
         - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
         - frontend
         - backend
      restart: unless-stopped 
    


volumes:
   postgres_data:


