name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_USER: arexali777

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend - install and syntax check
        working-directory: backend
        run: |
          npm ci
          for f in $(find src -name '*.js'); do node --check "$f"; done

      - name: Frontend - install, lint, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/patron-backend:latest
            ${{ env.DOCKER_USER }}/patron-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/patron-frontend:latest
            ${{ env.DOCKER_USER }}/patron-frontend:${{ github.sha }}